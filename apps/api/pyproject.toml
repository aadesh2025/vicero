[project]
name = "vicero-api"
version = "0.1.0"
description = "Vicero API — FastAPI backend for the AI chatbot & automation platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    # Offline IP -> country lookup for the pricing page's display currency (ADR-107). Pure-Python
    # reader for MaxMind-format .mmdb files; no network call per request.
    "maxminddb>=2.6",
    "structlog>=24.4",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "celery>=5.4",
    "argon2-cffi>=23.1",
    "python-jose[cryptography]>=3.3",
    "python-multipart>=0.0.12",
    "pypdf>=5.1",
    "python-docx>=1.1",
    # Main-content extraction for URL ingest: strips nav/header/footer/cookie-banner
    # boilerplate that a regex tag-strip would fold into the article text.
    "trafilatura>=1.12",
    "sentry-sdk[fastapi]>=2.0",
    # Async SMTP: the stdlib `smtplib` is blocking and would stall the event loop on
    # every send. One SMTP client covers every relay (Resend/Postmark/SendGrid/SES/...).
    "aiosmtplib>=3.0",
    # PII egress detection (docs/11 Phase B). Google's libphonenumber metadata, so a number
    # is validated against the real numbering plan of its country rather than a regex guess.
    # The leak that prompted this was an Indian mobile; a US-centric pattern misses it, and a
    # permissive one redacts order numbers and prices out of ordinary replies. See ADR-053.
    "phonenumbers>=8.13",
    # Structural chunking over a persisted DoclingDocument (docs/14 K2). The `chunking-openai`
    # extra is the tiktoken path, chosen to avoid pulling `transformers`/`torch` in for a
    # tokenizer — but docs/14 §3.8 Trap 1 is real and reproduced: `LineBasedTokenChunker`
    # imports the HF tokenizer unconditionally, so `huggingface-hub` must be pinned explicitly
    # even on the OpenAI path or the chunker import fails with ModuleNotFoundError.
    "docling-core[chunking-openai]>=2.0",
    "huggingface-hub>=0.26",
    # `app/rag/evaluate.py` imports yaml at module level to read the eval corpus, and the infra
    # tests parse the compose files. It was arriving transitively (trafilatura/docling-core) and
    # working by luck — a transitive drop would have broken an app module's import, not a test's.
    "pyyaml>=6.0",
    # NOT a runtime constraint — numpy arrives transitively via docling-core → pandas, and any
    # 2.x runs fine. This pins the *typecheck*: numpy 2.5's bundled stubs use the 3.12 `type`
    # statement, and under `python_version = "3.11"` (which is what the Dockerfile actually
    # ships) mypy reports that as a syntax error in numpy's own .pyi and then stops checking
    # our code entirely. `follow_imports` does not help — mypy always parses stub files. The
    # alternative was raising `python_version` to 3.12, which would have traded real 3.11
    # compatibility checking for a third-party stub's convenience. Revisit when the API image
    # moves off 3.11.
    "numpy<2.5",
    # Generic MCP tool provider (docs/17 Phase 1, ADR-070). Official SDK — gives us the
    # stdio and SSE ClientSession transports rather than hand-rolling the wire protocol.
    "mcp>=1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Alembic autogenerated migrations: keep long DDL lines as generated.
"migrations/versions/*" = ["E501"]
# The homoglyph-folding table and its tests are *made of* ambiguous Unicode — Cyrillic and
# Greek lookalikes are the input the module exists to defang (docs/11 §4-L0). RUF001/2/3
# flagging them is the linter working correctly on code where the finding does not apply.
"app/chat/normalize.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_guardrails_redteam.py" = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection defaults are the intended idiom, not a bug.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Form",
    "fastapi.File",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# These are reached only through lazy, try/except-guarded imports in `rag/docling_chunking.py`
# and `rag/tokenizer.py` — the package may legitimately be absent at runtime, so `Any` at the
# boundary is the accurate type rather than a concession. See the `numpy<2.5` pin above for the
# separate reason mypy cannot simply be pointed at their stubs.
[[tool.mypy.overrides]]
module = ["docling_core", "docling_core.*", "tiktoken", "tiktoken.*"]
follow_imports = "skip"
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
