# Vicero — production stack. TLS-terminated by Caddy, non-root app images, healthchecks,
# and a ONE-SHOT migration job (so scaling api/worker replicas never re-runs migrations).
#
#   cp ../.env.example ../.env   # set SECRET_KEY, LLM keys, … (goes INSIDE the containers)
#   docker compose --env-file ../.env -f docker-compose.prod.yml up -d --build
#
# ⚠️ `--env-file ../.env` is not optional, and the older instructions here were wrong about it.
# TWO different mechanisms read env, from TWO different files:
#
#   * `env_file: ../.env` gives the CONTAINERS their application settings (SECRET_KEY, LLM keys,
#     EMBEDDING_*, …). This one does work from `../.env`.
#   * `${VAR}` INTERPOLATION in this file is resolved by Compose itself, which reads the shell and
#     the `.env` beside the compose file (`infra/.env`) — never `../.env`. Verified: with
#     POSTGRES_PASSWORD present in `../.env` and absent from the shell,
#     `docker compose -f docker-compose.prod.yml config` still fails with
#     "required variable POSTGRES_PASSWORD is missing a value".
#
# So the interpolated ones — POSTGRES_PASSWORD, DOMAIN, API_DOMAIN, ACME_EMAIL, POSTGRES_USER,
# POSTGRES_DB, N8N_BASE_URL, OLLAMA_BASE_URL, NEXT_PUBLIC_API_BASE_URL, BACKUP_RETENTION_DAYS and
# the *_MEM_LIMIT set below — must come from `infra/.env`, the shell, or `--env-file`. It fails
# loudly rather than silently, which is the one good thing about it.
#
# n8n: this file has no n8n service. Whatever n8n you point N8N_BASE_URL at needs the SAME
# N8N_WEBHOOK_SIGNING_SECRET the API signs with (it is in ../.env, read via --env-file above — never keep a
# second copy anywhere) plus N8N_BLOCK_ENV_ACCESS_IN_NODE=false and NODE_FUNCTION_ALLOW_BUILTIN=crypto.
# See infra/n8n/README.md and RISK-REGISTER R15.
#
# Required (container env, ../.env): SECRET_KEY, CORS_ORIGINS (= https://$DOMAIN).
# Required (interpolation): POSTGRES_PASSWORD, DOMAIN, API_DOMAIN, ACME_EMAIL,
#   NEXT_PUBLIC_API_BASE_URL (= https://$API_DOMAIN).
name: vicero-prod

# ── Memory limits (docs/15 PROD-3, ADR-069) ──────────────────────────────────────────────────
#
# Nothing here had a limit, so any container could consume all RAM and the kernel OOM-killer then
# picked a victim host-wide — usually Postgres, because Postgres is the largest resident process.
# `restart: unless-stopped` then restarted everything into the same condition. Verified: a
# container that exceeds its own limit is killed alone (`OOMKilled=true`, exit 137), which is the
# whole point — the blast radius becomes the offending service instead of the database.
#
# ⚠️ THESE ARE CEILINGS, NOT A BUDGET, and they deliberately sum to more than the box has. Sizing
# every service at its worst case would leave most of a 16 GB machine idle; steady state is
# ~3.5-6 GB (docs/15 §3.1) plus ollama, `migrate` is one-shot and `backup` sleeps 24h at a time.
# What the ceilings buy is that no ONE service can take the whole host.
#
# ⚠️ A limit set too low turns a working service into a crashloop, so these have headroom over
# docs/15 §3.1's estimates — which §7 rates only medium confidence, and which were never measured
# on this stack. Postgres in particular is spiky: an HNSW index build is not the steady state.
# If a container is restarting with exit 137, that is this, not a bug: raise its variable.
# `docker inspect <container> --format '{{.State.OOMKilled}}'` confirms it in one command.
#
# Every value is overridable so the box, not this file, decides. Defaults target the 16 GB VPS of
# docs/15 §4 Option 1 (Docling core off, no chart VLM, no ASR, no self-hosted reranker).

x-api-env: &api-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-vicero}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-vicero}
  REDIS_URL: redis://redis:6379/0
  # Who may tell the API a visitor's real address (X-Forwarded-For; app/core/clientip.py): the
  # Docker networks, i.e. Caddy and the web container. Without this every visitor is one address
  # and every per-IP limit (signup, login, magic link, reset) is one shared bucket. Caddy sets the
  # header itself from the connection it accepted, so a value sent by a client is overwritten.
  # Never widen this to a public range.
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-172.16.0.0/12}
  N8N_BASE_URL: ${N8N_BASE_URL:-http://n8n:5678}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  # Explicit, and it must match the `uploads` volume mount on api + worker below. The default
  # (`./var/uploads`) resolves to the same directory via WORKDIR, but naming it here means the
  # setting and the mount are visibly one decision instead of two that happen to agree.
  UPLOAD_DIR: /app/var/uploads
  ENV: prod

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vicero}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-vicero}
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          # Generous on purpose. This is the process the OOM killer used to choose, and it is the
          # one service whose death loses in-flight work rather than just a request.
          memory: ${POSTGRES_MEM_LIMIT:-3g}
        reservations:
          # A soft floor: under host pressure the kernel reclaims from containers that are ABOVE
          # their reservation first. This is what "protect Postgres by construction" means here —
          # a limit alone only stops Postgres growing, it does not prefer it when RAM runs short.
          memory: ${POSTGRES_MEM_RESERVATION:-1g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vicero}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port published in prod — only reachable inside the compose network.

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-1g}
        reservations:
          memory: ${REDIS_MEM_RESERVATION:-256m}
    # ⚠️ Deliberately NO `--maxmemory`. Redis here is the Celery broker as well as the cache, and
    # `maxmemory` with an eviction policy would silently drop QUEUED TASKS under pressure — an
    # ingest or email job vanishing is worse than a visible restart, and AOF means a restart loses
    # nothing. The real control on broker growth is queue depth, not an eviction policy.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # One-shot: run migrations once, then exit. api/worker wait for it to complete successfully.
  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment: *api-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    deploy:
      resources:
        limits:
          # One-shot and idle for the life of the stack after it exits.
          memory: ${MIGRATE_MEM_LIMIT:-1g}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment: *api-env
    restart: unless-stopped
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    volumes:
      # docs/15 PROD-1. The api writes an upload here and the worker reads it back to ingest it;
      # they are separate containers, so without a SHARED volume the worker gets
      # "Stored file is missing" and the document lands in `failed`. Invisible in dev, where both
      # run from one directory on the host, and invisible to a smoke test, because URL and
      # pasted-text ingest never touch the filesystem.
      #
      # Single-VPS fix. It does NOT survive scaling to a second node — the proper answer is
      # object storage (docs/15 §4 Option 2), which the persisted DoclingDocument needs anyway.
      - uploads:/app/var/uploads
    deploy:
      resources:
        limits:
          # Two uvicorn workers. NO cpu limit: this is the p50 first-token path (NFR-1, 417 ms)
          # and capping it would add latency to every visitor to buy nothing — a runaway is a
          # memory problem here, not a CPU one.
          memory: ${API_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment: *api-env
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      # The same volume as `api`, at the same path. This is the other half of PROD-1: the
      # ingest task reads the file the api wrote (`ingest._stored_bytes`) and also writes the
      # persisted DoclingDocument *beside* it, so one shared mount covers both files.
      - uploads:/app/var/uploads
    deploy:
      resources:
        limits:
          # Four concurrent ingest processes, each holding a document's text, its chunks and a
          # batch of vectors. The most likely service to hit its ceiling, and the least harmful:
          # a killed worker loses a task that Redis still has.
          memory: ${WORKER_MEM_LIMIT:-3g}
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      # Start-order only, deliberately NOT `service_healthy`. Embeddings are required by the
      # knowledge base, not by the platform, and a worker that refuses to start takes webhooks,
      # email, campaigns and every other background job down with it. A queued ingest task waits
      # in Redis instead, which is a delay rather than a failure.
      ollama:
        condition: service_started

  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment: *api-env
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
    deploy:
      resources:
        limits:
          # A scheduler. It enqueues and sleeps.
          memory: ${BEAT_MEM_LIMIT:-512m}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.localhost}
        NEXT_PUBLIC_N8N_URL: ${NEXT_PUBLIC_N8N_URL:-http://localhost:5678}
    restart: unless-stopped
    environment:
      # Server-side BFF reaches the API in-network (refresh-token custody, see ADR-019).
      API_INTERNAL_URL: http://api:8000
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: ${WEB_MEM_LIMIT:-1g}
    depends_on:
      - api

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
      N8N_DOMAIN: ${N8N_DOMAIN:?set N8N_DOMAIN}
      # The editor's second password: user + bcrypt hash, written by ops/n8n-setup.sh (single-quoted in .env so
      # the `$` signs in the hash are not read as variables). Required: `up` refuses to run without them.
      N8N_EDITOR_GATE_USER: ${N8N_EDITOR_GATE_USER:?run ops/n8n-setup.sh}
      N8N_EDITOR_GATE_HASH: ${N8N_EDITOR_GATE_HASH:?run ops/n8n-setup.sh}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    deploy:
      resources:
        limits:
          # A reverse proxy. But it is also the only service holding port 443, so if it is the one
          # the OOM killer takes, the whole platform is unreachable — hence a limit, not "it is
          # small, never mind".
          memory: ${CADDY_MEM_LIMIT:-256m}
    depends_on:
      - web
      - api
      - n8n

  # n8n — the automation engine behind the client-visible Automations page (docs/26, ADR-111).
  #
  # PRIVATE by construction: no published port. Vicero reaches it at http://n8n:5678 on the compose network, and
  # Caddy serves ONLY the editor (behind a second password) on N8N_DOMAIN for staff; /webhook* is not served
  # publicly at all. Clients never see or log into n8n.
  #
  # Its own `n8n` database and role in the existing Postgres (created once by ops/n8n-setup.sh, which also writes
  # the random secrets into ../.env without printing them). Every ${VAR:?} below fails `docker compose up` BEFORE
  # anything is touched if setup has not been run, so a half-configured n8n can never take the stack down.
  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.43.1}
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:?run ops/n8n-setup.sh}
      # Encrypts every credential n8n stores. Losing it makes saved credentials unreadable: keep a copy of the
      # VARIABLE in your password manager (docs/25 §10).
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?run ops/n8n-setup.sh}
      N8N_HOST: ${N8N_DOMAIN:?set N8N_DOMAIN}
      N8N_PROTOCOL: https
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: https://${N8N_DOMAIN:?set N8N_DOMAIN}
      # Webhook URLs n8n prints are the INTERNAL ones: that is the only place they are ever called from.
      WEBHOOK_URL: http://n8n:5678/
      N8N_SECURE_COOKIE: "true"
      N8N_PROXY_HOPS: "1"
      # No telemetry, no update nags, no onboarding survey.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      # n8n keeps ~7 days of executions; Vicero keeps its own 30-day log (automation_runs).
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "5000"
      # A runaway workflow is stopped, not left to eat the 768m.
      EXECUTIONS_TIMEOUT: "300"
      EXECUTIONS_TIMEOUT_MAX: "600"
      NODE_OPTIONS: "--max-old-space-size=512"
      # Workflows read the shared secrets from the environment (HMAC check on the way in, signed report on the
      # way out) -- see infra/n8n/README.md.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_WEBHOOK_SIGNING_SECRET: ${N8N_WEBHOOK_SIGNING_SECRET:?run ops/n8n-setup.sh}
      AUTOMATION_REPORT_SECRET: ${AUTOMATION_REPORT_SECRET:?run ops/n8n-setup.sh}
      VICERO_API_INTERNAL_URL: http://api:8000
    expose:
      - "5678"
    volumes:
      - n8ndata:/home/node/.n8n
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 90s
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # 768m is the agreed ceiling on this 3.7 GB host. If `status.sh` reports low memory: lower the worker
          # concurrency first, then this (docs/25 §11). Nothing else is changed without asking.
          memory: ${N8N_MEM_LIMIT:-768m}

  # Embeddings for the knowledge base (docs/15 PROD-2).
  #
  # This service did not exist, while `x-api-env` above has always passed
  # OLLAMA_BASE_URL=http://ollama:11434 and `config.py` defaults `embedding_provider` to ollama.
  # So a knowledge base created with defaults in production pointed at a hostname that does not
  # resolve: every embed call failed, every document failed to ingest, and nothing about the
  # configuration looked wrong. Same family as the .env-comment-as-API-key outage — correct in
  # dev, silently wrong in production.
  #
  # ⚠️ Adding the service is only half of it. `ollama/ollama` starts EMPTY: it serves an API with
  # no models, and `POST /api/embeddings` for a model it does not have is an error, not a
  # download. So the command below pulls the model on every start (a no-op once the volume has
  # it) and the healthcheck asserts the model is actually present rather than that the port
  # answers — a healthy-but-empty Ollama is exactly the state that produced PROD-2.
  ollama:
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      # Weights persist across restarts. Without this, every `docker compose up` re-downloads
      # them: bandwidth on a metered VPS and minutes of failing ingest per deploy (docs/15 §5).
      - ollamadata:/root/.ollama
    # DELIBERATELY NO `ports:`. Ollama has no authentication of any kind, so a published port is
    # an open inference endpoint on the internet. Same rule as docling-serve (docs/14 §9).
    expose:
      - "11434"
    entrypoint: ["/bin/sh", "-c"]
    # `nomic-embed-text` is hardcoded, not `${EMBEDDING_MODEL}`: compose interpolates from
    # `infra/.env` and the shell, NOT from the `../.env` that `env_file` gives the containers, so
    # a variable here would silently keep pulling the default after someone changed the app's
    # model. `tests/test_infra_prod_compose.py` pins this string against `Settings.embedding_model`
    # so the two cannot drift unnoticed.
    # ONE list element on purpose. `sh -c` takes its whole script as a single argument; a plain
    # string here is split into argv words by compose, so `sh -c ollama serve & ...` would run
    # `ollama` alone and drop the rest into $0/$1. Verified with `docker compose config`.
    command:
      - "ollama serve &
         until ollama list >/dev/null 2>&1; do sleep 1; done;
         ollama pull nomic-embed-text || echo 'ollama pull failed - embeddings will not work';
         wait"
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text"]
      interval: 15s
      timeout: 10s
      retries: 5
      # First boot has to download the weights before this can pass.
      start_period: 300s
    deploy:
      resources:
        limits:
          # The only ML container in this stack, and therefore the one PROD-3 was really about.
          # docs/15 §3.2 estimates 1-2 GB, but that figure assumed a chat model; serving only
          # `nomic-embed-text` (a 137M-parameter embedder) should be well under it. UNMEASURED,
          # so the ceiling is generous rather than tight.
          memory: ${OLLAMA_MEM_LIMIT:-4g}
          # ⚠️ NO cpu limit, and this corrects docs/15 §3.4. That table splits work into
          # "latency-critical" (the reranker) and "throughput" (chart VLM, Whisper) and leaves
          # embeddings out — but `retrieval.search()` embeds the visitor's QUERY inline on every
          # RAG turn, so this service sits on the p50 first-token path exactly as the reranker
          # does. Capping its CPU would add latency to every grounded answer. CPU caps belong on
          # the batch ML services when they land (docling-serve, ASR), not here.

  # Nightly pg_dump + uploads-archive backup with rotation (see infra/scripts/backup.sh, ADR-082).
  backup:
    image: postgres:16
    restart: unless-stopped
    env_file: ../.env
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-vicero}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-vicero}
      BACKUP_DIR: /backups
      RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Read-only mount of the SAME `uploads` volume api/worker write to (below) — closes
      # RISK-REGISTER R1 / docs/15 §8.3: without this, restoring the DB dump alone leaves every
      # `documents` row pointing at a storage_path/docling_json_path that no longer exists.
      UPLOADS_DIR: /uploads
    volumes:
      - ./scripts:/scripts:ro
      - backups:/backups
      - uploads:/uploads:ro
    entrypoint: ["/bin/sh", "-c"]
    # Run the backup script once an hour past 3am UTC daily; keep the container alive with a sleep loop.
    command: ["while true; do sh /scripts/backup.sh || true; sleep 86400; done"]
    deploy:
      resources:
        limits:
          # Sleeps 24h at a time; the ceiling covers `pg_dump | gzip` streaming a large database.
          memory: ${BACKUP_MEM_LIMIT:-512m}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  caddydata:
  caddyconfig:
  backups:
  # Uploaded documents AND the persisted DoclingDocument beside each one. Shared by api +
  # worker (PROD-1) and, since ADR-082, mounted read-only into `backup` too — the same volume,
  # never a second copy — so a nightly archive of it lands beside the DB dump instead of
  # restoring the database alone leaving every `documents` row pointing at a file that is gone
  # (docs/15 §8.3, RISK-REGISTER R1 — closed).
  uploads:
  ollamadata:
  n8ndata:
