name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    name: API (lint · typecheck · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vicero
          POSTGRES_PASSWORD: vicero
          POSTGRES_DB: vicero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vicero"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-test-secret-key
      DATABASE_URL: postgresql+asyncpg://vicero:vicero@localhost:5432/vicero
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Mypy (typecheck)
        run: uv run mypy app

      - name: Migrate database
        run: uv run alembic upgrade head

      # Runs before the full suite and on its own so a guardrail regression is unmissable:
      # buried among 500+ tests, "1 failed" reads as flake. A failure here means an attack the
      # corpus already knew about got through, or a legitimate customer message started being
      # refused — a build failure either way, never a warning (docs/11 §5, Phase D).
      # `-s` so the segmented recall table lands in the job log; English and non-English are
      # reported separately and must never be merged into one headline number.
      - name: Red-team corpus (guardrail regression gate)
        run: uv run pytest tests/test_redteam_corpus.py tests/test_guardrails_redteam.py -q -s

      # Retrieval quality, on its own for the same reason as the red-team gate above: a drop in
      # NDCG buried among 780 tests reads as flake. Two steps, because they answer different
      # questions and only one of them can run without a model.
      #
      # The harness's own tests pin the arithmetic — a silently wrong NDCG would make every
      # later phase report an improvement it did not earn.
      - name: Retrieval eval harness (metrics + corpus integrity)
        run: uv run pytest tests/test_retrieval_eval.py -q

      # The keyword half against the frozen corpus, scored end to end through the real ingest
      # pipeline. Deterministic and model-free: FTS never touches embeddings, so the fake
      # embedder changes nothing. This would have caught the P0-1 index regression, and it
      # catches a chunking or fts_config regression. Fails on an NDCG@10 drop beyond tolerance.
      #
      # `dense` and `hybrid` are NOT run here — they need a genuine embedding provider, and a
      # dense score under the fake embedder measures a hash function. Run `make
      # eval-retrieval-full` locally against Ollama and commit the baseline it prints.
      - name: Retrieval eval (keyword half, regression gate)
        run: uv run python ../../scripts/eval_retrieval.py --variants fts

      - name: Pytest
        run: uv run pytest -q

      # The docs site renders its API reference from a committed snapshot of the schema, so
      # an endpoint added without regenerating it would silently go undocumented. Runs in
      # the API job because it needs the API's venv.
      - name: Docs reference is current
        run: |
          uv run python ../../scripts/generate-openapi.py
          cd ../..
          node scripts/generate-env-reference.mjs
          git diff --exit-code -- apps/web/content/generated \
            || { echo "::error::Generated docs reference is stale — run 'make docs-generate' and commit."; exit 1; }

  security:
    name: Dependency audit (pip-audit · npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: pip-audit (Python dependencies)
        working-directory: apps/api
        # Advisory: reports known CVEs in resolved deps without blocking the pipeline.
        continue-on-error: true
        run: |
          uv export --format requirements-txt --no-hashes --no-emit-project -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: npm audit (web dependencies)
        working-directory: apps/web
        continue-on-error: true
        run: |
          npm ci
          npm audit --audit-level=high

  web:
    name: Web (lint · typecheck · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Playwright · PRD criteria 1–7)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vicero
          POSTGRES_PASSWORD: vicero
          POSTGRES_DB: vicero
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vicero"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      SECRET_KEY: ci-e2e-secret-key
      DATABASE_URL: postgresql+asyncpg://vicero:vicero@localhost:5432/vicero
      REDIS_URL: redis://localhost:6379/0
      # Deterministic + keyless: every LLM/embedding call runs on the Fake provider.
      LLM_FORCE_FAKE: "true"
      # The suite creates many tenants; lift the auth throttle so it isn't rate-limited.
      AUTH_RATE_LIMIT: "100000"
      # Creating an org is staff-only in production. The suite bootstraps a tenant per spec
      # through the public API, so it needs the test-only escape. The production rule itself
      # is pinned by tests/test_org_creation_gate.py, which turns this back off.
      ALLOW_SELF_SERVE_ORGS: "true"
      # Binding an n8n workflow normally REFUSES a webhook it cannot verify as signature-checking
      # (tools.n8n_unverifiable), and it verifies by reading the workflow from n8n over N8N_API_KEY. Keyless
      # CI runs no n8n, so e2e/05 would always be refused. Production keeps the check on (the default);
      # tests/test_n8n.py pins the check itself. Test-only escape, same idea as ALLOW_SELF_SERVE_ORGS.
      N8N_REQUIRE_SIGNATURE_CHECK: "false"
      # Self-serve signup (docs/18) is on in production: every signup would also get a
      # metered trial workspace. The suite bootstraps its own unmetered tenants instead, so it
      # runs the staff-provisioned model; trial UI is covered by e2e/30-trial-ui.spec.ts and the
      # enforcement by tests/test_self_serve_*.py.
      SELF_SERVE_ENABLED: "false"
      ENV: dev
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      E2E_API_URL: http://localhost:8000
      E2E_WEB_URL: http://localhost:3001
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API deps
        working-directory: apps/api
        run: uv sync

      - name: Migrate database
        working-directory: apps/api
        run: uv run alembic upgrade head

      - name: Start API + worker (Fake provider)
        working-directory: apps/api
        run: |
          uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          uv run celery -A app.worker.celery_app worker --pool=solo --loglevel=warning > /tmp/worker.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/readyz > /dev/null; then echo "API ready"; break; fi
            sleep 1
          done
          curl -sf http://localhost:8000/readyz

      - name: Install web deps + browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build + start web
        working-directory: apps/web
        run: |
          npm run build
          npx next start -p 3001 > /tmp/web.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3001/login > /dev/null; then echo "Web ready"; break; fi
            sleep 1
          done

      # Via the wrapper, not `npx playwright test`, so local and CI share one entry point and
      # the sweep cannot drift out of one of them. The wrapper preserves Playwright's exit
      # code, so a failing suite still fails the job.
      - name: Run Playwright E2E
        working-directory: apps/web
        run: npm run test:e2e

      - name: Upload report + service logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            /tmp/api.log
            /tmp/worker.log
            /tmp/web.log
          retention-days: 7
          if-no-files-found: ignore
