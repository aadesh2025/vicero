# Retrieval eval corpus — seed set (docs/13 R2, docs/14 P0-2).
#
# A support knowledge base for a fictional clothing/fabric retailer, which is the shape of a
# real Vicero client. Deliberately built to be HARD for a lexical retriever:
#
#   * every document has at least one NEAR-MISS SIBLING that shares most of its vocabulary and
#     answers a different question (domestic vs international refunds, store hours vs support
#     hours, order cancellation vs subscription cancellation). Lexical overlap alone must not
#     be enough to win.
#   * the numbers echo real incidents. `store-hours` says Mon-Sat 10am-7pm IST and
#     `refunds-domestic` says 14 days, because those are the two facts the 2026-08-02
#     fabrication invented ("Mon-Fri 9am-5pm", "30-day refund window") when retrieval scored
#     0.0318 and no context block was appended at all.
#   * `refunds-domestic` / `refunds-international` are the docs/14 §3.2 W2 case: the
#     distinguishing fact lives in the heading, and a chunk that drops its heading path carries
#     no signal about which one it is.
#
# FROZEN. Editing a document changes what every committed baseline number means. Add new
# documents at the end and re-baseline explicitly; never reword one in place.

- id: refunds-domestic
  title: "Returns Policy > Domestic Orders"
  text: |
    Returns Policy - Domestic Orders

    Items bought for delivery within India may be sent back for a full refund within 14 days
    of the date the parcel was signed for. The garment must be unworn, unwashed and carry its
    original tags. Once the parcel reaches our warehouse the amount is credited to the original
    payment method within 5 to 7 working days. Sale items and clearance stock are covered by
    this window on the same terms as full-price stock.

- id: refunds-international
  title: "Returns Policy > International Orders"
  text: |
    Returns Policy - International Orders

    Parcels shipped outside India are covered for 30 days from the delivery date, because
    transit times vary considerably by destination. The buyer pays the return carriage and any
    customs charges raised on the outbound shipment are not refundable. We recommend a tracked
    service; we cannot process a refund on a parcel we never received. Refunds are issued in
    the currency of the original transaction.

- id: exchanges
  title: "Returns Policy > Exchanges"
  text: |
    Exchanges

    If a garment does not fit, an exchange is quicker than a return and a fresh purchase. Tell
    us the size you want and we hold it against your order for 10 days. There is no charge for
    the first exchange on any order; a second exchange on the same item is treated as a return
    and a new purchase. Exchanges are limited to the same style in a different size or colour.

- id: damaged-item
  title: "Problems With an Order > Damaged on Arrival"
  text: |
    Damaged on Arrival

    If a garment reaches you torn, stained or with a broken fastening, photograph it as it came
    out of the packaging and send the pictures with your order number. We replace it at no cost
    and arrange collection of the faulty piece. Do not wash or attempt a repair first, as that
    makes the fault impossible for us to assess with the mill.

- id: wrong-item
  title: "Problems With an Order > Wrong Item Sent"
  text: |
    Wrong Item Sent

    Picking errors happen. If the contents of your parcel do not match your confirmation email,
    keep everything in its packaging and contact us. We despatch the correct piece the same
    working day and send a prepaid label for the one you received in error. You are never
    charged twice while the two parcels cross.

- id: store-hours
  title: "Contact > Showroom Opening Hours"
  text: |
    Showroom Opening Hours

    Our showroom is open Monday to Saturday, 10am to 7pm IST. We are closed on Sundays and on
    national holidays. The last fitting appointment of the day is taken at 6:15pm. During
    Diwali week the showroom stays open until 9pm; those dates are announced on the front page
    each year.

- id: support-hours
  title: "Contact > When You Will Hear Back"
  text: |
    When You Will Hear Back

    Written enquiries can be sent at any hour. The team works through the queue between 9am and
    6pm IST on working days, and most messages are answered the same day. Anything that arrives
    over a weekend is picked up on Monday morning. Urgent problems with an order already in
    transit are prioritised ahead of general questions.

- id: shipping-domestic
  title: "Delivery > Within India"
  text: |
    Delivery Within India

    Orders confirmed before 2pm IST leave the same working day. Metro addresses usually receive
    the parcel in 2 to 4 working days and other pin codes in 4 to 7. Delivery is free on orders
    above Rs 2,500; below that a flat charge of Rs 99 applies. We do not deliver to PO boxes.

- id: shipping-international
  title: "Delivery > Outside India"
  text: |
    Delivery Outside India

    We ship to most countries by tracked air freight, typically arriving in 7 to 14 working
    days. Duties and import taxes are payable by the recipient on arrival and are not included
    in the price shown at checkout. A few destinations are excluded by our carrier; the address
    form will tell you at the point of entry rather than after payment.

- id: tracking
  title: "Delivery > Following Your Parcel"
  text: |
    Following Your Parcel

    A tracking reference is emailed the moment the carrier scans your parcel into their
    network, which is usually a few hours after despatch rather than instantly. The reference
    can take a further 12 hours to become active on the carrier's own site. If it has not moved
    for three working days, tell us and we open an enquiry with the carrier.

- id: delivery-delays
  title: "Delivery > When a Parcel Is Late"
  text: |
    When a Parcel Is Late

    Weather, strikes and customs inspections all add days that no carrier can predict. We treat
    a domestic parcel as lost once it is 10 working days past its estimate and an international
    one at 21, and at that point we either resend or refund at your choice. You do not have to
    wait for the carrier's own investigation to finish before we act.

- id: cancel-order
  title: "Orders > Cancelling an Order"
  text: |
    Cancelling an Order

    An order can be stopped at no cost any time before it is handed to the carrier, which in
    practice means within a couple of hours on a working day. After that it has to run its
    course and be sent back under the returns policy instead. Cancelling does not close your
    account or affect anything else you have bought.

- id: cancel-subscription
  title: "Fabric Club > Ending Your Membership"
  text: |
    Ending Your Membership

    The Fabric Club renews on the same date each month and can be stopped from the membership
    page at any time. Stopping it prevents the next charge; it does not refund the month you
    are currently in, and the swatch box for that month is still sent. Your accumulated points
    stay on the account for a year afterwards.

- id: payment-methods
  title: "Payment > What We Accept"
  text: |
    What We Accept

    Cards from all major networks, UPI, net banking from 40-odd banks, and three of the common
    wallets. Cash on delivery is offered on domestic orders below Rs 5,000 and carries a Rs 50
    handling charge. We do not accept cheques, bank drafts or cryptocurrency.

- id: payment-failed
  title: "Payment > A Charge That Did Not Go Through"
  text: |
    A Charge That Did Not Go Through

    When a payment is declined but the money has left your account, what you are seeing is
    almost always a hold rather than a completed charge. Banks release these automatically,
    usually within 3 to 5 working days and occasionally up to 10. No order is created against a
    declined attempt, so placing a new one does not risk being billed twice.

- id: gift-cards
  title: "Payment > Gift Cards"
  text: |
    Gift Cards

    Gift cards are delivered by email within a few minutes of purchase and are valid for three
    years from the date of issue. They can be spent across several orders until the balance
    runs out and can be combined with a promotional code. They cannot be exchanged for cash and
    are not replaced if the code is forwarded to the wrong person.

- id: store-credit
  title: "Payment > Store Credit"
  text: |
    Store Credit

    Store credit is what we issue when a return cannot go back to the original payment method,
    for instance when the card has since expired. It never lapses, appears automatically at
    checkout, and is used up before any card is charged. Unlike a gift card it is tied to your
    account and cannot be transferred to anyone else.

- id: sizing-womens
  title: "Sizing > Women's Garments"
  text: |
    Women's Garments

    Our women's range is cut to Indian standard sizing and runs slightly close through the
    shoulder compared with European labels. If you are between two sizes on the chart, take the
    larger one for structured pieces and the smaller for anything in jersey. Every product page
    lists the measurements of the piece itself, not of the body it is meant to fit.

- id: sizing-mens
  title: "Sizing > Men's Garments"
  text: |
    Men's Garments

    Men's shirts are offered in both a regular and a slim block; the slim block takes about two
    inches out of the chest and waist. Trousers are sold by waist measurement with a fixed
    inside leg per size, and we can shorten a leg at no charge if you tell us at the time of
    ordering. Collar sizes follow the neck measurement, not the chest.

- id: care-cotton
  title: "Fabric Care > Cotton and Linen"
  text: |
    Cotton and Linen

    Wash at 30 degrees on a gentle cycle and take the piece out while it is still slightly damp.
    Both fibres crease by nature and press best with a warm iron on the reverse before they are
    completely dry. Avoid tumble drying, which is what causes most of the shrinkage people
    attribute to the first wash.

- id: care-silk
  title: "Fabric Care > Silk"
  text: |
    Silk

    Silk should be cleaned professionally. If you must do it at home, use cold water and a
    detergent made for delicates, never wring the piece out, and dry it flat away from direct
    sun, which fades the dye unevenly. Deodorant and perfume mark silk permanently, so dress
    after they have dried.

- id: bulk-pricing
  title: "Trade > Wholesale and Bulk"
  text: |
    Wholesale and Bulk

    Orders above 50 pieces of one style are quoted individually rather than priced from the
    site. Lead times run to 3 to 5 weeks depending on the mill's schedule, and a 40% deposit is
    taken before cutting begins. Trade customers are invoiced on 30-day terms once a first
    order has been completed.

- id: retail-pricing
  title: "Pricing > What the Price Includes"
  text: |
    What the Price Includes

    Every price shown on the site includes GST. Nothing further is added at checkout for a
    domestic order beyond the delivery charge, which is displayed before you confirm. Prices
    are held for the duration of a season and any reduction is applied automatically rather
    than needing a code.

- id: promo-codes
  title: "Pricing > Promotional Codes"
  text: |
    Promotional Codes

    One code per order, entered on the payment page rather than in the basket. Codes do not
    stack with each other but they do apply on top of a seasonal reduction unless the code
    itself says otherwise. If a code is rejected the message on screen names the reason, most
    often that it is restricted to a category your basket does not contain.

- id: loyalty-points
  title: "Fabric Club > Points"
  text: |
    Points

    Members earn a point for every hundred rupees spent, and a hundred points comes off a
    future order as a hundred rupees. Points post once the return window on the order has
    closed rather than at the moment of purchase. They expire twelve months after the last
    activity on the account.

- id: account-password
  title: "Your Account > Signing In"
  text: |
    Signing In

    If you cannot get in, use the reset link on the sign-in page; it arrives within a minute and
    stays valid for an hour. Accounts are not locked after failed attempts, so repeated tries do
    nothing worse than waste time. Changing the password signs out every device except the one
    you changed it on.

- id: account-deletion
  title: "Your Account > Closing Your Account"
  text: |
    Closing Your Account

    Ask us in writing and the account is closed within seven days. Order records are kept for
    the period tax law requires even after closure, but the address book, saved cards and
    marketing preferences are removed. Closure is final; a later purchase starts a new account
    with no history and no points.

- id: privacy-marketing
  title: "Your Account > Marketing Preferences"
  text: |
    Marketing Preferences

    Email and SMS are separate settings and turning one off leaves the other running, which is
    the usual reason someone still hears from us after opting out. Transactional messages about
    an order you have placed are always sent and are not affected by these settings. Changes
    take effect on the next send rather than retroactively.

- id: warranty
  title: "Quality > Manufacturing Faults"
  text: |
    Manufacturing Faults

    A seam that fails, a zip that parts or dye that runs on a first correct wash is a fault in
    the making and is covered for a year from purchase whatever the returns window says. Wear,
    fading with age, and damage from an incorrect wash are not covered. We repair where a repair
    is sound and replace where it is not.

- id: appointments
  title: "Showroom > Booking a Fitting"
  text: |
    Booking a Fitting

    Fittings are half an hour and are booked from the showroom page or by phone. Walk-ins are
    welcome but a booked slot takes priority, and Saturdays fill about a week ahead. Bring the
    shoes you intend to wear with the piece, since hem length is decided in the room and cannot
    be judged afterwards.

# ── exact-identifier documents ───────────────────────────────────────────────────────────
#
# ADDED after the first weight sweep, because the corpus above could not measure the thing it
# was being used to tune. Every query in q001-q036 was written to share as little vocabulary
# with its answer as possible, which is a fine test of *dense* retrieval and a rigged one
# against keyword search: the sweep found every hybrid weight losing to dense-only, converging
# on dense as the weight went to zero. Reading that as "keyword search is worthless" would have
# been fitting a production constant to a benchmark with a hole in it.
#
# Keyword search earns its place on tokens an embedding model cannot represent: order
# references, SKUs, decline codes, carrier names, form numbers. A visitor pasting
# `AZ-2026-004417` or asking about `E51` is the case where dense retrieval degrades and BM25 is
# exact. These documents and queries q037-q046 exist so the sweep can see both halves.

- id: order-reference-format
  title: "Orders > Your Order Reference"
  text: |
    Your Order Reference

    Every order is given a reference in the form AZ-2026-000000, where the middle block is the
    year it was placed. It appears on the confirmation email, the invoice inside the parcel and
    the account page. Quote it in full when you contact us; the last six digits on their own are
    not unique across years.

- id: payment-decline-codes
  title: "Payment > What the Decline Code Means"
  text: |
    What the Decline Code Means

    E05 means the bank refused the transaction without giving a reason, and a different card is
    the only remedy. E51 means insufficient funds. E14 means the card number was mistyped. E91
    means the bank could not be reached and is worth retrying in a few minutes. None of these
    are charges, and none of them create an order.

- id: courier-partners
  title: "Delivery > Who Carries Your Parcel"
  text: |
    Who Carries Your Parcel

    Domestic parcels go with Delhivery or Bluedart depending on the pin code, and we do not let
    you choose between them. Overseas parcels go with Aramex. Bluedart handles most metro
    addresses and Delhivery the rest. Cash on delivery is only available on the Delhivery
    network.

- id: product-codes
  title: "Products > How Style Codes Are Built"
  text: |
    How Style Codes Are Built

    A style code such as WC-KUR-2201 names the label, the garment type and the season: WC is the
    house label, KUR a kurta, SHR a shirt, TRS trousers, and the four digits are the season and
    the design number. Codes are printed on the care label and quoted on every invoice. A code
    ending in X is a sample and was never sold.

- id: warranty-claim-form
  title: "Quality > Making a Claim"
  text: |
    Making a Claim

    A manufacturing fault is claimed on form QF-12, downloadable from the quality page. It asks
    for the style code, the date of purchase and two photographs. Claims without a style code
    cannot be traced back to the mill batch and are returned unprocessed. Form QF-12 replaced
    the older QF-08 in 2025 and the old one is no longer accepted.

- id: outlet-addresses
  title: "Showroom > Where to Find Us"
  text: |
    Where to Find Us

    The main showroom is on Nungambakkam High Road in Chennai. There is a smaller outlet in
    Coimbatore on Avinashi Road that carries the previous season only, and a concession inside
    the Phoenix mall in Bengaluru. The Coimbatore outlet does not take fitting appointments.

# ── Long, multi-section documents (added 2026-08-17 for docs/14 K2-5) ──────────────────────
#
# Everything above is 272-445 characters, i.e. ONE chunk per document at any chunk size this
# product uses. That makes the whole corpus blind to chunking: the mechanism docs/14 §3.2 W2
# describes — the second and third chunk of a section carrying no heading, because the heading
# was consumed by the first — literally cannot occur in it. The first K2-5 run measured
# structural chunking at a hybrid NDCG@10 of 0.8737 against 0.8974 and would have rejected the
# phase on a corpus incapable of exercising it.
#
# This is the same class of blind spot the 2026-08-13 session found when its first weight sweep
# "proved" hybrid retrieval was worthless: every query had been written with deliberately low
# lexical overlap, which is a fair test of dense retrieval and a rigged one against keyword
# search. **Check a benchmark for blind spots before letting it decide anything.**
#
# So: four documents of 1800-2400 characters, each with several `## ` sections, and the
# queries below aim at facts in the SECOND, THIRD or FOURTH section. On the legacy path the
# chunk holding the answer has no heading in it at all. Topics are deliberately new — nothing
# here competes with an existing gold document, so every qrel above stays valid.

- id: alterations
  title: "Alterations & Tailoring"
  text: |
    Alterations and Tailoring

    ## In-Store Alterations

    Every garment bought from us can be adjusted by the tailoring desk at the Chennai showroom.
    Walk-ins are taken between 11am and 5pm on weekdays; on Saturdays the desk works to
    appointment only because the fitting rooms are busy. Bring the garment unworn and unwashed
    with its tags still attached, along with the shoes you intend to wear it with, since hem
    length is measured against the shoe. The tailor will pin the garment on you and write the
    measurements onto the job card.

    ## Sending a Garment by Post

    If you cannot reach a showroom you may post the garment to the tailoring desk instead. Write
    to the alterations team first and they will issue a job number; a parcel arriving without one
    sits unidentified and cannot be matched to an order. Enclose the printed job sheet and, where
    the change is a length, a second garment of the correct length to copy. We pay the carriage
    on the return leg but not on the leg to us.

    ## What It Costs

    Shortening a hem, taking in a waist or moving a button is done free of charge on any garment
    bought from us within ninety days of purchase. Beyond ninety days, or on a garment bought
    elsewhere, the desk charges by the operation: a hem is 250 rupees, a waist adjustment 400
    rupees, and reshaping a shoulder or a sleeve head 900 rupees. Embroidered and hand-worked
    panels cannot be cut and are quoted individually.

    ## How Long It Takes

    Plan on ten working days from the moment the garment reaches the tailoring desk, not from the
    day you posted it. Simple length changes are usually back inside a week. Between October and
    early January the desk runs a longer queue and the same job takes three weeks, so a garment
    needed for a wedding in that window should be sent well ahead. The desk telephones when the
    garment is ready and holds it for thirty days.

- id: fabric-sourcing
  title: "Fabric & Sourcing"
  text: |
    Fabric and Sourcing

    ## Where the Cotton Comes From

    Our cotton is grown and spun in Tamil Nadu and Andhra Pradesh, and the greater part of it
    reaches us through two mills near Erode that we have bought from since the company began.
    Long-staple varieties are reserved for shirting, which is why a shirt woven from them takes a
    press so cleanly. Yarn counts run from 40s for everyday poplin up to 120s for the finest
    voile in the summer range.

    ## Silk and Handloom

    Silk is woven at Kanchipuram on pit looms by weaver families we buy from directly rather than
    through an agent. Because each length is made by one weaver, small irregularities in the
    ground and slight variation in the zari are inherent to the cloth and are not treated as
    faults. Handloom cotton comes from cooperatives in Chettinad, and the width of a handloom
    panel varies by a centimetre or two from piece to piece.

    ## Certifications

    The Erode mills hold GOTS certification for organic cotton and OEKO-TEX Standard 100 for the
    absence of harmful substances, and the certificates are reissued annually. Our silk carries
    the Silk Mark issued by the Central Silk Board, which is what distinguishes genuine mulberry
    silk from an art-silk blend sold under the same name. We are audited by an outside body once
    a year and the summary report is published on request.

    ## Dye and Colourfastness

    Everything is dyed in reactive dyes rather than direct dyes, which bond to the fibre instead
    of sitting on it. In practice this means a deep indigo or a madder red will release a small
    amount of loose colour on the first wash and then stop; this is the surplus dye leaving the
    surface, not the shade running out of the cloth. Wash a strong colour by itself the first
    time, in cold water, and dry it in shade rather than direct sun.

- id: gift-services
  title: "Gift Services"
  text: |
    Gift Services

    ## Wrapping

    Any order can be wrapped at checkout for 150 rupees per item. The wrap is an unbleached
    cotton sleeve tied with a jute cord rather than paper, so it survives the post and can be
    reused. Two wrapping styles are offered, a plain sleeve and one block-printed by hand in
    Sanganer, and the printed sleeve takes an extra day to prepare because it is made to order.

    ## Messages

    A handwritten card goes in with the parcel at no charge. Type the words into the message box
    at checkout and one of the showroom staff writes it out; there is room for roughly forty
    words on the card. We do not print the message on the invoice or the outside of the parcel,
    so the wording stays between you and the person receiving it. Emoji and non-Latin scripts
    other than Tamil cannot be reproduced by hand reliably and are politely dropped.

    ## Hiding the Price

    Ask for a gift receipt and the parcel travels with a slip that lists the items and the order
    reference but shows no amounts anywhere, and the tax invoice is emailed to you instead of
    being placed in the box. The recipient can exchange or return against that slip on the same
    terms as the buyer, and any refund goes back to the original payment method rather than to
    them. Removing the price tags from the garments themselves is done on request but has to be
    asked for separately, because the tag also carries the size.

    ## Seasonal Hampers

    Between October and December we assemble hampers of a shawl, a stole and a set of napkins in
    a lidded box. Hampers are made up in the Chennai workroom and cannot be altered once boxed.
    They ship by surface only, because the box does not fit the courier's air cage.

- id: packaging-recycling
  title: "Packaging & Recycling"
  text: |
    Packaging and Recycling

    ## What the Parcel Is Made Of

    Orders travel in a corrugated carton made from recycled board, closed with paper tape and
    filled with shredded offcuts from the cutting floor rather than bought-in void fill. The
    garment inside sits in a cotton bag. Nothing in the parcel needs to be separated before it
    goes into a paper recycling stream, and the paper tape can be left on the box.

    ## Sending the Packaging Back

    Keep the carton if you think you may return the garment, since a return travels best in the
    box it arrived in. If you do not want it, the courier will take the flattened carton away on
    any subsequent delivery to the same address at no charge, and we credit fifty loyalty points
    the first time you do this in a calendar year. Cotton bags can be posted back in bundles of
    five or more using the prepaid label printed inside the flap.

    ## Plastic

    There is no plastic film, no bubble wrap and no adhesive plastic tape anywhere in a standard
    parcel. The one exception is the small polythene sleeve around a silk garment, which protects
    it from moisture in transit during the monsoon months and is marked as recyclable LDPE; ask
    at checkout and we will pack the silk in tissue and a cotton bag instead. Courier partners
    occasionally add their own plastic overwrap on the international leg and that is outside our
    control.

    ## Carbon

    Deliveries within Tamil Nadu run on the courier's electric fleet in Chennai, Coimbatore and
    Madurai. For everything else we buy offsets through a cookstove programme in Karnataka, and
    the annual retirement certificate is published alongside the sourcing audit.
