# API + worker + beat + web. Replace image refs with your registry (see CI/CD in ci.yml).
# The migration Job runs once per deploy; the api waits for it (initContainer gate below).
#
# ⚠️ FILE UPLOAD INGEST DOES NOT WORK ON THESE MANIFESTS. Read this before hosting a client.
#
# docs/15 PROD-1: the api writes an uploaded document to `UPLOAD_DIR` and the Celery worker reads
# it back to ingest it. Here they are separate Deployments — 2 replicas each — with no shared
# storage, so the worker gets "Stored file is missing" and the document lands in `failed`. URL and
# pasted-text ingest are unaffected, which is why a smoke test passes while the feature is broken.
#
# This is deliberately NOT fixed with a PVC, and the reason is a trade rather than an oversight:
#   * A ReadWriteOnce PVC cannot be mounted by 4 pods across nodes, so it would not fix it.
#   * A ReadWriteMany PVC would, but needs an RWX-capable StorageClass (NFS/CephFS/EFS/Azure
#     Files). On a cluster without one the PVC stays Pending and every api and worker pod stays
#     in ContainerCreating — trading a broken *feature* for a broken *platform*.
# The single-VPS compose deployment fixes it with a shared named volume
# (`infra/docker-compose.prod.yml`). The fix for multi-replica k8s is object storage — docs/15 §4
# Option 2 and §5, which the persisted DoclingDocument needs anyway.
#
# To run these manifests WITH file ingest, on a cluster that has RWX: create a
# `vicero-uploads` PVC with `accessModes: [ReadWriteMany]`, then add to the api and worker
# containers `volumeMounts: [{ name: uploads, mountPath: /app/var/uploads }]` and to each pod
# spec `volumes: [{ name: uploads, persistentVolumeClaim: { claimName: vicero-uploads } }]`.
# `UPLOAD_DIR` is already `/app/var/uploads` in the prod deployment; set it in vicero-config.
#
# ⚠️ There is also no `ollama` Deployment here, so the default embedding provider is unreachable
# for the same reason it was in compose (docs/15 PROD-2). The API logs
# `embedding_provider_unreachable` at error level on startup rather than failing quietly.
apiVersion: batch/v1
kind: Job
metadata:
  name: vicero-migrate
  namespace: vicero
  annotations:
    # Re-run on each deploy by templating a unique name, or delete+apply this Job in CD.
    "vicero/note": "one-shot: alembic upgrade head"
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ghcr.io/OWNER/vicero-api:latest
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: vicero-config }
            - secretRef: { name: vicero-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: vicero
spec:
  replicas: 2
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: ghcr.io/OWNER/vicero-api:latest
          command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: vicero-config }
            - secretRef: { name: vicero-secrets }
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /readyz, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "256Mi" }
            limits: { cpu: "1", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: vicero
spec:
  selector: { app: api }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: vicero
spec:
  replicas: 2
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: ghcr.io/OWNER/vicero-api:latest
          command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
          envFrom:
            - configMapRef: { name: vicero-config }
            - secretRef: { name: vicero-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: beat
  namespace: vicero
spec:
  replicas: 1 # exactly one beat scheduler
  selector:
    matchLabels: { app: beat }
  template:
    metadata:
      labels: { app: beat }
    spec:
      containers:
        - name: beat
          image: ghcr.io/OWNER/vicero-api:latest
          command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=info"]
          envFrom:
            - configMapRef: { name: vicero-config }
            - secretRef: { name: vicero-secrets }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: vicero
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: ghcr.io/OWNER/vicero-web:latest
          ports: [{ containerPort: 3000 }]
          env:
            - name: API_INTERNAL_URL
              value: http://api:8000
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: vicero
spec:
  selector: { app: web }
  ports: [{ port: 3000, targetPort: 3000 }]
