name: Release (build · push · smoke · deploy)

# Builds + pushes the api/web images to GHCR on master and version tags, smoke-tests the built
# API image against /readyz, and (tag/dispatch, gated on secrets) deploys + verifies on the host.

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build + push images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: vicero-api
            context: apps/api
            build_args: ""
          - image: vicero-web
            context: apps/web
            build_args: |
              NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL || 'http://localhost:8000' }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}


  smoke:
    name: Smoke-test the API image (/readyz)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: vicero, POSTGRES_PASSWORD: vicero, POSTGRES_DB: vicero }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vicero" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Build the API image locally
        uses: docker/build-push-action@v6
        with:
          context: apps/api
          push: false
          load: true
          tags: vicero-api:smoke
          cache-from: type=gha

      - name: Run migrations on the built image
        run: |
          docker run --rm --network host \
            -e DATABASE_URL=postgresql+asyncpg://vicero:vicero@localhost:5432/vicero \
            -e SECRET_KEY=ci-smoke vicero-api:smoke alembic upgrade head

      - name: Start the API container
        run: |
          docker run -d --name api --network host \
            -e DATABASE_URL=postgresql+asyncpg://vicero:vicero@localhost:5432/vicero \
            -e REDIS_URL=redis://localhost:6379/0 -e SECRET_KEY=ci-smoke \
            vicero-api:smoke

      - name: Wait for /readyz to be green
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/readyz || true)
            echo "attempt $i → $code"
            if [ "$code" = "200" ]; then echo "READY"; exit 0; fi
            sleep 2
          done
          echo "readyz never turned 200"; docker logs api; exit 1

      - name: Tear down
        if: ${{ always() }}
        run: docker rm -f api || true

  deploy:
    name: Deploy to host (tag/dispatch, gated on secrets)
    needs: [build-and-push, smoke]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH (skipped if DEPLOY_HOST unset)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "${DEPLOY_HOST}" ]; then
            echo "No DEPLOY_HOST secret — deploy is a documented template. See docs/09-DEPLOYMENT.md §6."
            exit 0
          fi
          echo "Would SSH to ${DEPLOY_HOST} and run:"
          echo "  cd /opt/vicero/infra && git pull && \\"
          echo "  docker compose -f docker-compose.prod.yml pull && \\"
          echo "  docker compose -f docker-compose.prod.yml up -d --build   # runs the one-shot migrate job"
          echo "  then: curl -fsS https://\$API_DOMAIN/readyz   # post-deploy smoke"
