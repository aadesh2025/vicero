# BotForge — dev stack. Bring the whole platform up with: docker compose up
# Config comes from ../.env (copy ../.env.example first). Service URLs below are
# overridden for in-network addressing.
name: botforge

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-botforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (not "botforge")}
      POSTGRES_DB: ${POSTGRES_DB:-botforge}
    ports:
      # Same reason as N8N_HOST_PORT below: 5432 is routinely already taken on a dev machine by
      # another project's Postgres, and BotForge must not be pointed at that one — it would
      # migrate someone else's database. Container port stays 5432, so DATABASE_URL is the only
      # other thing to line up. Default keeps the canonical setup unchanged.
      #
      # Loopback only. A bare "host:container" mapping publishes on every interface, which put the
      # dev database on the LAN / hotspot. Other containers reach it over the compose network and
      # are unaffected; only host-side tools (alembic, pytest, psql) use this published port.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-botforge}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      # Loopback only, for the same reason as Postgres above — and Redis has no password.
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-botforge}
      REDIS_URL: redis://redis:6379/0
      # Proxies whose X-Forwarded-For the API believes (app/core/clientip.py): loopback plus Docker's
      # private networks, which covers the web container and the host-side port mapping. The web
      # app has no proxy of its own in dev, so per-client counters see the client as "unknown" here.
      TRUSTED_PROXIES: 127.0.0.1,::1,172.16.0.0/12
      N8N_BASE_URL: http://n8n:5678
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ../apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Phase 1 will prepend: alembic upgrade head &&
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-botforge}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      # Internal address only; the service publishes no host port (docs/14 §9).
      DOCLING_ENDPOINT: http://docling:5001
    volumes:
      - ../apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Celery worker: runs document-ingestion (RAG) and later background jobs (Phase 7+).
    command: celery -A app.worker.celery_app worker --loglevel=info

  beat:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-botforge}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-botforge}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ../apps/api:/app
      - api_venv:/app/.venv
    depends_on:
      redis:
        condition: service_healthy
    # Celery beat: fires periodic jobs (the webhook retry sweep — see celery_app.beat_schedule).
    command: celery -A app.worker.celery_app beat --loglevel=info

  web:
    image: node:22-bookworm-slim
    working_dir: /app
    env_file: ../.env
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3001:3000"
    volumes:
      - ../apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - api

  n8n:
    image: n8nio/n8n
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-botforge}
      GENERIC_TIMEZONE: UTC
      # n8n resolves telemetry.n8n.io at boot and *exits* if DNS fails (observed:
      # `getaddrinfo EAI_AGAIN telemetry.n8n.io` killed this container). Off means the
      # container comes up on a flaky or offline network too.
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Webhook signature verification. BotForge signs every call to an n8n webhook
      # (HMAC-SHA256 of "<ts>.<raw body>", integrations/n8n_client.py); each workflow's first
      # Code node recomputes it with this secret and answers 401 on a mismatch. Code nodes are
      # sandboxed from both env vars and `crypto` by default in n8n 2.x, so both are opened up here.
      # ONE source of truth: the root .env (what the API signs with). Compose only interpolates from
      # infra/.env by default, so start with `make up` or `--env-file .env --env-file ../.env` - do NOT
      # add a copy to infra/.env (two copies drift; R15). Empty => every workflow rejects every call
      # (fails closed), never accepts.
      # Tradeoff: any workflow author on this n8n can read its env; it is BotForge-operated and staff-authored.
      N8N_WEBHOOK_SIGNING_SECRET: ${N8N_WEBHOOK_SIGNING_SECRET:-}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
    ports:
      # Host port is configurable because 5678 is often already taken — on the build machine
      # by an unrelated n8n. Container port stays 5678, so N8N_BASE_URL is the only other
      # thing to line up. Default keeps the canonical setup unchanged.
      - "${N8N_HOST_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n

  # Layout-aware document extraction (docs/14 K1-2). Its own service rather than in-process in
  # the worker, for the reasons in docs/14 §4.1: the worker image stays free of torch and the
  # layout models, a bad PDF cannot OOM the worker, and it scales (or gets a GPU) on its own.
  docling:
    image: ghcr.io/docling-project/docling-serve:latest
    environment:
      DOCLING_SERVE_ENABLE_UI: "false"
      # RapidOCR downloads its models on first use and breaks on a read-only filesystem —
      # called out in Docling's own PdfPipelineOptions docstring (docs/14 §3.8 trap 3). The
      # volume below is that writable cache; without it OCR fails at runtime, not at startup.
      HF_HOME: /opt/app-root/src/.cache/huggingface
    volumes:
      - doclingmodels:/opt/app-root/src/.cache
    # DELIBERATELY NO `ports:`. docs/14 §9: this service accepts arbitrary documents and URLs,
    # so publishing it is SSRF plus resource exhaustion. It is reachable on the compose network
    # as http://docling:5001 and must stay that way.
    expose:
      - "5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5001/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Layout models load on boot; a short start period would mark it unhealthy while it works.
      start_period: 120s

  ollama:
    image: ollama/ollama
    ports:
      # Changed from 11434 to 11435 to avoid collision with host-installed Ollama.
      # If you want the containerized version, kill the host Ollama and revert to 11434:11434.
      - "11435:11434"
    volumes:
      - ollamadata:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    # Same gap as the prod compose had (docs/15 PROD-2): `ollama/ollama` starts EMPTY. It serves an
    # API with no models, and embedding against a model it has not pulled is an error, not a
    # download — so a bare `image: ollama/ollama` gives a container that answers and cannot embed.
    # One list element: `sh -c` takes its whole script as a single argument.
    command:
      - "ollama serve &
         until ollama list >/dev/null 2>&1; do sleep 1; done;
         ollama pull nomic-embed-text || echo 'ollama pull failed - embeddings will not work';
         wait"

volumes:
  pgdata:
  redisdata:
  n8ndata:
  ollamadata:
  doclingmodels:
  api_venv:
  web_node_modules:
